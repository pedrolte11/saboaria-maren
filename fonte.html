<title>Saboaria Maren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2EEE9; --surface:#FBF8F4; --surface-2:#E9E3D9; --line:#DCD4C7;
  --ink:#26221F; --ink-2:#5F574F; --ink-3:#8C8378;
  --accent:#8A6A33; --accent-soft:#F0E9DC; --accent-line:#CDBE9E; --on-accent:#F7F3EC;
  --btn:#26221F; --btn-txt:#F7F3EC;
  --ouro:#8A6A33; --ouro-soft:#F1E8D9;
  --good:#4A6F52; --good-soft:#E3EBE1; --warn:#8E6410; --bad:#9C4F35; --bad-soft:#F6E4DC;
  --shadow:0 1px 2px rgba(38,34,31,.05), 0 8px 24px -14px rgba(38,34,31,.3);
  --r:14px; --w:780px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191614; --surface:#221E1B; --surface-2:#2C2723; --line:#3A342E;
    --ink:#F0EAE1; --ink-2:#B3A99C; --ink-3:#867C70;
    --accent:#D6B378; --accent-soft:#2A2319; --accent-line:#4A3E2C; --on-accent:#191614;
    --btn:#E9E2D6; --btn-txt:#201C19;
    --ouro:#D6B378; --ouro-soft:#2A2319;
    --good:#84B48D; --good-soft:#1F2A20; --warn:#D9AE5E; --bad:#DE9077; --bad-soft:#2E2019;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
    --ground:#191614; --surface:#221E1B; --surface-2:#2C2723; --line:#3A342E;
    --ink:#F0EAE1; --ink-2:#B3A99C; --ink-3:#867C70;
    --accent:#D6B378; --accent-soft:#2A2319; --accent-line:#4A3E2C; --on-accent:#191614;
    --btn:#E9E2D6; --btn-txt:#201C19;
    --ouro:#D6B378; --ouro-soft:#2A2319;
    --good:#84B48D; --good-soft:#1F2A20; --warn:#D9AE5E; --bad:#DE9077; --bad-soft:#2E2019;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Jost, "Segoe UI", system-ui, sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:var(--w); margin:0 auto; padding:0 16px 150px}
@media (min-width:900px){ :root{ --w:960px } }

/* ---------- marca ---------- */
.marca{background:var(--ground); padding:20px 16px 14px; text-align:center}
.marca-in{max-width:var(--w); margin:0 auto}
.logo-btn{appearance:none; border:0; background:none; padding:0; cursor:pointer; display:block; margin:0 auto; line-height:0}
.logo-btn:focus-visible{outline:2px solid var(--accent); outline-offset:6px; border-radius:8px}
.logo{width:min(210px, 56vw); height:auto; color:var(--ink); display:block; overflow:visible}
.tagline{margin:9px 0 0; font-size:9.5px; letter-spacing:.26em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400}

/* peças animáveis */
#agua, #raios, #barco, #nome{transform-box:fill-box}
#agua{transform-origin:center}
#raios{transform-origin:center bottom}
#barco{transform-origin:center bottom}
#nome{transform-origin:center top}

@keyframes mar-balanco{ 0%,100%{transform:translateX(-7px)} 50%{transform:translateX(7px)} }
@keyframes barco-boia{
  0%,100%{transform:translate(0,0) rotate(-1.4deg)}
  50%{transform:translate(6px,-3px) rotate(1.4deg)}
}
@keyframes raios-respira{ 0%,100%{opacity:.62; transform:scale(.985)} 50%{opacity:1; transform:scale(1.02)} }

/* entrada */
@keyframes ent-arte{ from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)} }
@keyframes ent-raios{ from{opacity:0; transform:scale(.72)} to{opacity:.62; transform:scale(.985)} }
@keyframes ent-barco{ from{opacity:0; transform:translateX(-150px) rotate(-5deg)} to{opacity:1; transform:translateX(0) rotate(-1.4deg)} }
@keyframes ent-areia{ from{transform:scaleY(0)} to{transform:scaleY(1)} }
@keyframes ent-nome{ from{opacity:.15; transform:translateY(9px)} to{opacity:1; transform:translateY(0)} }

.logo #marca-arte{animation:ent-arte 1s cubic-bezier(.22,.9,.3,1) both}
.logo #raios{animation:ent-raios .95s cubic-bezier(.22,.9,.3,1) .22s both, raios-respira 7s ease-in-out 2.4s infinite}
.logo #agua{animation:mar-balanco 11s ease-in-out 1.1s infinite}
.logo #barco{animation:ent-barco 1.5s cubic-bezier(.25,.85,.3,1) .3s both, barco-boia 5.5s ease-in-out 2s infinite}
.logo #nome{animation:ent-nome 1s ease-out .75s both}
.logo #areia-rect{animation:ent-areia .95s cubic-bezier(.3,.85,.35,1) .75s both; transform-box:fill-box; transform-origin:center top}

@media (prefers-reduced-motion:reduce){
  .logo #marca-arte, .logo #raios, .logo #agua, .logo #barco, .logo #nome, .logo #areia-rect{animation:none !important}
  .logo #raios{opacity:.72}
  .logo #areia-rect{transform:none}
}

/* botão de tema */
.tema{appearance:none; border:1px solid var(--line); background:var(--surface); cursor:pointer;
  width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:var(--ink-2);
  flex:0 0 auto; margin-left:10px; align-self:center; margin-bottom:6px; padding:0}
.tema:hover{color:var(--ink); border-color:var(--ink-3)}
.tema svg{width:17px; height:17px; display:block}
.tema .ic-sol{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .tema .ic-sol{display:block}
  :root:not([data-theme="light"]) .tema .ic-lua{display:none}
}
:root[data-theme="dark"] .tema .ic-sol{display:block}
:root[data-theme="dark"] .tema .ic-lua{display:none}

/* ---------- cabeçalho ---------- */
header{position:sticky; top:0; z-index:30; background:var(--ground); border-bottom:1px solid var(--line)}
.head-in{max-width:var(--w); margin:0 auto; padding:0 16px}
nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  appearance:none; border:0; background:none; cursor:pointer; font:inherit; white-space:nowrap; flex:0 0 auto;
  font-weight:600; font-size:14.5px; color:var(--ink-3);
  padding:9px 12px; border-bottom:2px solid transparent; border-radius:6px 6px 0 0;
}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{color:var(--accent); border-bottom-color:var(--accent)}
.saved{margin-left:auto; align-self:center; font-size:11.5px; letter-spacing:.04em;
  text-transform:uppercase; color:var(--ink-3); padding-bottom:4px; white-space:nowrap;
  flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
.saved.on{color:var(--good)}
@media (max-width:640px){ .saved{display:none} }   /* com 4 abas + tema, o aviso não cabe */

/* ---------- blocos ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.stack{display:flex; flex-direction:column; gap:14px}
.stack-sm{display:flex; flex-direction:column; gap:8px}
section.block{margin-top:22px}
h2.sec{font-family:"Cormorant Garamond", Georgia, serif; font-size:25px; font-weight:600; letter-spacing:.005em; margin:0 0 3px; text-wrap:balance}
p.sec-note{margin:0 0 10px; font-size:13.5px; color:var(--ink-2); max-width:62ch}
.eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); font-weight:700}

/* ---------- formulário ---------- */
label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:4px}
input, select, textarea{
  width:100%; font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:10px; padding:10px 11px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}
input.num{font-family:"IBM Plex Mono", ui-monospace, monospace; text-align:right; font-variant-numeric:tabular-nums}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.grid2 > div, .grid3 > div{display:flex; flex-direction:column}
.grid2 > div > label, .grid3 > div > label{flex:1 0 auto}
.field-inline{display:flex; gap:8px}
.field-inline .g{flex:1 1 auto}
.field-inline .u{flex:0 0 92px}

button.btn{
  appearance:none; cursor:pointer; font:inherit; font-weight:600; font-size:14.5px;
  border-radius:10px; padding:10px 14px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink);
}
button.btn:hover{border-color:var(--ink-3)}
button.primary{background:var(--btn); border-color:var(--btn); color:var(--btn-txt)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:none; border-style:dashed; color:var(--ink-2); width:100%}
button.btn.grande{width:100%; padding:15px; font-size:16px; letter-spacing:.01em}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px);
  z-index:60; background:var(--ink); color:var(--ground);
  padding:12px 20px; border-radius:99px; font-size:14.5px; font-weight:600;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.45); opacity:0;
  transition:opacity .18s ease, transform .18s ease; pointer-events:none; max-width:88vw; text-align:center;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.toast.aviso{background:var(--bad); color:#FFF}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
button.tiny{font-size:12.5px; padding:6px 9px; border-radius:8px; background:none;
  border:1px solid var(--line); color:var(--ink-2); cursor:pointer; font-family:inherit}
button.tiny:hover{color:var(--ink); border-color:var(--ink-3)}
button.tiny.danger{color:var(--bad); border-color:var(--bad)}
.row-actions{display:flex; gap:6px; flex-wrap:wrap}
.kit-add{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}
@media (max-width:520px){ .kit-add{grid-template-columns:1fr} }

.seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px}
.seg button{flex:1; appearance:none; border:0; cursor:pointer; font:inherit; font-size:13.5px;
  font-weight:600; background:none; color:var(--ink-2); border-radius:7px; padding:7px 6px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

/* ---------- linhas de item ---------- */
.item{display:grid; grid-template-columns:1fr 116px 34px; gap:8px; align-items:center;
  padding:9px 0; border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .qtd-wrap{position:relative}
.item .qtd-wrap .un{position:absolute; right:9px; top:50%; transform:translateY(-50%);
  font-size:11.5px; color:var(--ink-3); pointer-events:none; font-weight:600}
.item input.num{padding-right:30px}
.item .x{appearance:none; border:0; background:none; cursor:pointer; color:var(--ink-3);
  font-size:19px; line-height:1; padding:6px; border-radius:8px}
.item .x:hover{color:var(--bad); background:var(--bad-soft)}
.item .sub{font-size:11.5px; color:var(--ink-3); grid-column:1 / -1; margin-top:-2px;
  font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.lote{display:inline-flex; align-items:center; gap:6px; margin:0;
  font-family:Jost, sans-serif; font-size:10px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.lote input{width:118px; padding:4px 8px; font-size:12px; border-radius:8px;
  font-family:"IBM Plex Mono", monospace; letter-spacing:0; text-transform:none}
.busca{position:relative; margin:0 0 10px}
.busca input{padding-left:34px}
.busca svg{position:absolute; left:11px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--ink-3); pointer-events:none}
.busca-nada{font-size:13.5px; color:var(--ink-2); padding:16px 2px}
.ficha{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.ficha .selo{font-family:"IBM Plex Mono", monospace; font-size:12px; font-weight:600;
  background:var(--accent-soft); color:var(--accent); padding:4px 10px; border-radius:8px}
.recipe .lt{font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--ink-3)}

/* ---------- formatos ---------- */
.fmt{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
#formatos{display:grid; gap:12px}
@media (min-width:900px){ #formatos{grid-template-columns:repeat(auto-fit, minmax(330px, 1fr)); align-items:start} }
.fmt-top{padding:14px; display:flex; flex-direction:column; gap:12px}
.fmt-nome{display:flex; gap:8px; align-items:center}
.fmt-nome input{font-weight:600}
.fmt-nome .x{appearance:none; border:0; background:none; cursor:pointer; color:var(--ink-3);
  font-size:20px; line-height:1; padding:7px; border-radius:8px; flex:0 0 auto}
.fmt-nome .x:hover{color:var(--bad); background:var(--bad-soft)}
.fmt-emb{border-top:1px solid var(--line); padding:12px 14px}
.fmt-foot{
  border-top:1px solid var(--line); background:var(--surface-2);
  padding:11px 14px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
}
.fmt-foot .kk{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); font-weight:700}
.fmt-foot .vv{font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
  font-size:16px; font-weight:600; letter-spacing:-.01em}
.fmt-foot .mid{text-align:center} .fmt-foot .end{text-align:right}

/* ---------- preços por formato ---------- */
.pv-row{display:grid; grid-template-columns:1fr 132px; gap:8px 12px;
  align-items:center; padding:12px 0; border-top:1px solid var(--line)}
.pv-row:first-child{border-top:0}
.pv-row .nm{font-weight:600; font-size:15px}
.pv-row .ct{font-size:12.5px; color:var(--ink-2); font-family:"IBM Plex Mono", monospace;
  font-variant-numeric:tabular-nums; display:block}
.pv-row .out{grid-column:1 / -1; margin-top:-2px; display:flex; flex-direction:column;
  gap:5px; font-size:12px; color:var(--ink-3);
  font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
.pv-row .out b{font-weight:600; color:var(--ink-2)}
.pv-row .o1, .pv-row .o2{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pv-row .out b.lucro{color:var(--good)}
.pv-row .out b.lucro.neg{color:var(--bad)}
.pv-exemplo{margin:0; font-size:13px; color:var(--ink-2); background:var(--surface-2);
  border-radius:10px; padding:10px 12px}
.pv-exemplo b{color:var(--ink)}

/* ---------- ordenação ---------- */
.ordenar{display:flex; align-items:center; gap:9px; justify-content:flex-end;
  margin:0 0 10px; flex-wrap:wrap}
.ordenar label{margin:0; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  font-weight:700; color:var(--ink-3)}
.ordenar select{width:auto; min-width:190px; padding:7px 10px; font-size:13.5px}

/* ---------- estoque ---------- */
.est{border-top:1px solid var(--line); padding:13px 0; display:grid;
  grid-template-columns:1fr auto; gap:6px 12px; align-items:start}
.est:first-of-type{border-top:0}
.est .nm{font-weight:600; font-size:15px}
.est .dt{font-size:12.5px; color:var(--ink-2); font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
.est .val{text-align:right; white-space:nowrap; font-family:"IBM Plex Mono", monospace;
  font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-2)}
.est .acoes{grid-column:1 / -1; display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:2px}
.est .campo{position:relative; width:132px}
.est .campo input{padding-right:32px; text-align:right}
.est .campo .un{position:absolute; right:10px; top:50%; transform:translateY(-50%);
  font-size:11.5px; color:var(--ink-3); font-weight:600; pointer-events:none}
.faz{border-top:1px solid var(--line); padding:12px 0; display:flex; gap:12px;
  align-items:baseline; justify-content:space-between; flex-wrap:wrap}
.faz:first-child{border-top:0}
.faz .nm{font-weight:600; font-size:15px}
.faz .qt{font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums;
  font-weight:600; white-space:nowrap}
.faz .falta{flex-basis:100%; font-size:12.5px; color:var(--bad);
  font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums}
.produzi{display:flex; gap:12px; align-items:flex-start; padding:14px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
.produzi.on{border-color:var(--good); background:var(--good-soft)}
.produzi input{width:20px; height:20px; flex:0 0 auto; margin-top:2px; accent-color:var(--good)}
.produzi .txt{flex:1 1 auto}
.produzi .txt{display:flex; flex-direction:column; gap:3px}
.produzi .tt{display:block; font-weight:600; font-size:15px}
.produzi .sub{display:block; font-size:12.5px; color:var(--ink-2)}

/* ---------- lote proporcional ---------- */
.esc-linha{display:grid; grid-template-columns:1fr 108px 78px; gap:8px 10px;
  align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.esc-linha:first-of-type{border-top:0}
.esc-linha .nm{font-weight:600; font-size:14.5px}
.esc-linha .pede{font-size:11.5px; color:var(--ink-3); font-family:"IBM Plex Mono", monospace;
  font-variant-numeric:tabular-nums; display:block}
.esc-linha .frac{text-align:right; font-family:"IBM Plex Mono", monospace;
  font-variant-numeric:tabular-nums; font-size:13px; font-weight:600; white-space:nowrap}
.esc-linha.limita{background:var(--ouro-soft); margin:0 -10px; padding:9px 10px; border-radius:10px; border-top-color:transparent}
.esc-linha.limita .frac{color:var(--ouro)}
.esc-linha .campo{position:relative}
.esc-linha .campo input{padding-right:32px; text-align:right}
.esc-linha .campo .un{position:absolute; right:10px; top:50%; transform:translateY(-50%);
  font-size:11.5px; color:var(--ink-3); font-weight:600; pointer-events:none}
.esc-aviso{grid-column:1/-1; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  font-weight:700; color:var(--ouro); margin-top:-2px}
.esc-fator{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding:14px; background:var(--surface-2); border-radius:12px}
.esc-fator .big{font-family:"IBM Plex Mono", monospace; font-size:26px; font-weight:600; letter-spacing:-.02em}
.esc-fator .txt{font-size:13px; color:var(--ink-2)}
.esc-prev{border-top:1px solid var(--line); padding-top:12px; margin-top:4px}
.esc-prev .par{display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:13.5px}
.esc-prev .par b{font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; font-weight:600}
.esc-prev .tt{font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:700;
  color:var(--ink-3); margin:10px 0 4px}
@media (max-width:520px){ .esc-linha{grid-template-columns:1fr 96px 66px} }

/* ---------- resultados ---------- */
.lines{display:flex; flex-direction:column; gap:0}
.line{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  padding:8px 0; border-top:1px solid var(--line); font-size:14.5px}
.line:first-child{border-top:0}
.line .k{color:var(--ink-2)}
.line .v{font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; font-weight:500}
.line.total{border-top:2px solid var(--ink); padding-top:11px; font-weight:700; font-size:16px}
.line.total .k{color:var(--ink)}

.tabela{width:100%; border-collapse:collapse; font-size:13.5px}
.tabela th{text-align:right; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-3); font-weight:700; padding:0 0 7px; white-space:nowrap}
.tabela th:first-child{text-align:left}
.tabela td{padding:8px 0; border-top:1px solid var(--line); text-align:right;
  font-family:"IBM Plex Mono", monospace; font-variant-numeric:tabular-nums; white-space:nowrap}
.tabela td:first-child{text-align:left; font-family:Jost, sans-serif; font-weight:600; white-space:normal}
.tabela td + td, .tabela th + th{padding-left:10px}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}

.bar{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface);
  border-top:1px solid var(--line); box-shadow:0 -8px 24px -18px rgba(0,0,0,.5);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar-in{max-width:var(--w); margin:0 auto; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}

<script>
(function(){
"use strict";

/* ============ estado ============ */
var KEY = "saboaria.v1", KEY_ANTIGA = "sabonaria.v1";
var UNIDADES = {
  g:{base:"g", f:1, rot:"g"}, kg:{base:"g", f:1000, rot:"kg"},
  ml:{base:"ml", f:1, rot:"ml"}, L:{base:"ml", f:1000, rot:"L"},
  un:{base:"un", f:1, rot:"un"}
};
var state = vazio();
var view = "receitas";
var editId = null;
var confirmando = null;
var formAberto = null;
var busca = "";
var canPublish = false;

function vazio(){ return { v:2, updatedAt:null, insumos:[], receitas:[], kits:[] }; }
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }

/* ============ números e moeda ============ */
function num(v){
  if (typeof v === "number") return isFinite(v) ? v : 0;
  if (v == null) return 0;
  var s = String(v).trim().replace(/\s|R\$/g, "");
  if (!s) return 0;
  if (s.indexOf(",") > -1) s = s.replace(/\./g, "").replace(",", ".");
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
var BRL = new Intl.NumberFormat("pt-BR", {style:"currency", currency:"BRL"});
var BRL4 = new Intl.NumberFormat("pt-BR", {style:"currency", currency:"BRL", minimumFractionDigits:4, maximumFractionDigits:4});
function money(n){ return BRL.format(isFinite(n) ? n : 0); }
function moneyFine(n){ return (Math.abs(n) > 0 && Math.abs(n) < 0.01) ? BRL4.format(n) : BRL.format(n||0); }
function moneyG(n){ return (Math.abs(n) < 1) ? BRL4.format(n||0) : BRL.format(n||0); }
function dec(n, c){
  c = c == null ? 2 : c;
  return new Intl.NumberFormat("pt-BR", {minimumFractionDigits:0, maximumFractionDigits:c}).format(isFinite(n)?n:0);
}
function dec2(n){ return new Intl.NumberFormat("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2}).format(isFinite(n)?n:0); }
function br(v){ return v == null || v === "" ? "" : String(v).replace(".", ","); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ============ cálculo ============ */
function insumo(id){
  for (var i=0;i<state.insumos.length;i++) if (state.insumos[i].id === id) return state.insumos[i];
  return null;
}
function custoBase(ins){                    // quanto custa 1 g / 1 ml / 1 un
  if (!ins) return 0;
  var u = UNIDADES[ins.unidade] || UNIDADES.g;
  var qtdBase = num(ins.qtd) * u.f;
  return qtdBase > 0 ? num(ins.preco) / qtdBase : 0;
}
function baseDe(ins){ return (UNIDADES[(ins && ins.unidade) || "g"] || UNIDADES.g).base; }
function precificar(custo, r){
  var pv = num(r.precoValor);
  if (r.precoModo === "markup") return custo * (1 + pv / 100);
  return custo * (pv > 0 ? pv : 0);   // multiplicador
}
function custoEmbalagem(lista){             // por sabonete
  var t = 0;
  (lista || []).forEach(function(it){
    var ins = insumo(it.insumoId);
    if (ins) t += num(it.qtd) * custoBase(ins);
  });
  return t;
}

function calcular(r){
  var o = { ingredientes:0, embalagem:0, trabalho:0, custoLote:0, pesoTotal:0,
            unidades:0, porGrama:0, faturamento:0, lucroLote:0, formatos:[], porPeso:true };

  (r.itens || []).forEach(function(it){
    var ins = insumo(it.insumoId);
    if (ins) o.ingredientes += num(it.qtd) * custoBase(ins);
  });

  var formatos = r.formatos || [];
  formatos.forEach(function(f){
    var q = Math.max(0, Math.round(num(f.qtd)));
    o.unidades += q;
    o.pesoTotal += num(f.peso) * q;
  });

  var tv = num(r.trabalhoValor);
  var trabalhoPorUn = (r.trabalhoModo === "unidade") ? tv : 0;
  o.trabalho = (r.trabalhoModo === "unidade") ? tv * o.unidades : tv;

  // o que se reparte entre os sabonetes conforme o peso de cada um
  var rateavel = o.ingredientes + (r.trabalhoModo === "unidade" ? 0 : tv);
  o.porPeso = o.pesoTotal > 0;
  o.porGrama = o.porPeso ? rateavel / o.pesoTotal : 0;
  var porUnidadeIgual = o.unidades > 0 ? rateavel / o.unidades : 0;

  formatos.forEach(function(f){
    var q = Math.max(0, Math.round(num(f.qtd)));
    var peso = num(f.peso);
    var emb = custoEmbalagem(f.embalagem);
    var massa = o.porPeso ? o.porGrama * peso : porUnidadeIgual;
    var custoUn = massa + emb + trabalhoPorUn;
    var sugerido = precificar(custoUn, r);
    var praticado = num(f.precoPraticado);
    var preco = praticado > 0 ? praticado : sugerido;
    o.embalagem += emb * q;
    o.faturamento += preco * q;
    o.formatos.push({
      i:o.formatos.length, ref:f, nome:f.nome, qtd:q, peso:peso, pesoLote:peso * q,
      massa:massa, emb:emb, custoUn:custoUn, sugerido:sugerido,
      praticado:praticado, preco:preco, lucroUn:preco - custoUn,
      margem: preco > 0 ? ((preco - custoUn) / preco) * 100 : 0,
      custoLote:custoUn * q, lucroLote:(preco - custoUn) * q
    });
  });

  o.custoLote = o.ingredientes + o.trabalho + o.embalagem;
  o.lucroLote = o.faturamento - o.custoLote;
  o.margemLote = o.faturamento > 0 ? (o.lucroLote / o.faturamento) * 100 : 0;
  return o;
}

/* ============ migração ============ */
var migrou = false;
function migrar(d){
  if (!d || !Array.isArray(d.receitas)) return d;
  if (!Array.isArray(d.kits)) d.kits = [];
  d.receitas.forEach(function(r){
    if (r.precoModo === "margem"){          // regra antiga: margem sobre a venda
      var m = Math.min(Math.max(num(r.precoValor), 0), 95) / 100;
      r.precoModo = "multiplicador";
      r.precoValor = m < 1 ? Math.round((1 / (1 - m)) * 100) / 100 : 2;
      migrou = true;
    }
    if (Array.isArray(r.formatos)) return;
    migrou = true;
    r.formatos = [{
      id: uid(),
      nome: "Padrão",
      peso: r.pesoUnit != null ? r.pesoUnit : "",
      qtd: r.rendimento != null ? r.rendimento : "",
      embalagem: r.embalagem || [],
      precoPraticado: r.precoPraticado != null ? r.precoPraticado : ""
    }];
    delete r.pesoUnit; delete r.rendimento; delete r.embalagem; delete r.precoPraticado;
  });
  d.v = 2;
  return d;
}

/* ============ persistência ============ */
var saveTimer = null, publishing = false, pendente = false;
function marcar(txt, ok){
  var el = document.getElementById("saved");
  el.textContent = txt; el.className = "saved" + (ok ? " on" : "");
}
function agendarSave(){
  state.updatedAt = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  marcar("salvando…", false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(gravar, 1400);
}
function gravar(){
  escreveArquivo();
  if (!canPublish){ marcar(arq && arqPermitido ? "salvo · cópia" : "salvo", true); return; }
  if (publishing){ pendente = true; return; }
  publishing = true;
  var corpo = JSON.stringify(state);
  window.claude.use("artifact").then(function(a){
    if (!a) throw new Error("sem capacidade");
    return a.publish({ "data/dados.json": { content: corpo, contentType: "application/json" } });
  }).then(function(){
    publishing = false; marcar("salvo", true);
    if (pendente){ pendente = false; gravar(); }
  })["catch"](function(err){
    publishing = false; pendente = false;
    var code = err && err.code;
    if (code === "conflict"){ marcar("recarregando…", false); return; }
    if (code === "not_writer" || code === "not_granted" || code === "capability_disabled" ||
        code === "not_declared" || code === "capability_removed"){ canPublish = false; }
    marcar("salvo", true);
  });
}
function carregar(){
  var local = null;
  try {
    local = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!local) local = JSON.parse(localStorage.getItem(KEY_ANTIGA) || "null");   // dados da versão anterior
  } catch(e){}
  var busca = canPublish
    ? fetch("data/dados.json", {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; })["catch"](function(){ return null; })
    : Promise.resolve(null);          // fora do claude.ai os dados vivem só no aparelho
  return busca.then(function(remoto){
    var t1 = local && local.updatedAt ? Date.parse(local.updatedAt) : 0;
    var t2 = remoto && remoto.updatedAt ? Date.parse(remoto.updatedAt) : 0;
    var win = (t1 > t2 ? local : remoto) || local || remoto;
    if (win && Array.isArray(win.insumos) && Array.isArray(win.receitas)) state = migrar(win);
    marcar(state.updatedAt ? "salvo" : "", !!state.updatedAt);
    if (migrou) agendarSave();
    // rede de segurança: navegador vazio mas o arquivo de cópia ainda acessível
    if (arq && arqPermitido && !state.insumos.length && !state.receitas.length){
      return arq.getFile().then(function(f){ return f.text(); }).then(function(txt){
        var d = JSON.parse(txt);
        if (d && Array.isArray(d.insumos) && Array.isArray(d.receitas) && (d.insumos.length || d.receitas.length)){
          state = migrar(d);
          try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
        }
      })["catch"](function(){});
    }
  });
}

/* ============ navegação ============ */
function ir(v, id){
  if (v !== "receitas") busca = "";
  view = v; editId = id || null; confirmando = null; window.scrollTo(0,0); render(); }
function render(){
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    var alvo = (view === "editor") ? "receitas" : (view === "kit" ? "kits" : view);
    b.setAttribute("aria-current", b.dataset.nav === alvo ? "true" : "false");
  });
  var app = document.getElementById("app");
  if (view === "receitas") app.innerHTML = telaReceitas();
  else if (view === "despensa") app.innerHTML = telaDespensa();
  else if (view === "kits") app.innerHTML = telaKits();
  else if (view === "kit") app.innerHTML = telaKitEditor();
  else if (view === "backup") app.innerHTML = telaBackup();
  else if (view === "editor") app.innerHTML = telaEditor();
  atualizarBarra();
}

/* ============ busca e rastreio ============ */
function semAcento(t){
  return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function lotesDe(r){                       // todos os lotes usados nesta produção
  var vistos = {}, saida = [];
  function junta(lote, insumoId){
    var l = (lote || "").trim(); if (!l) return;
    var ins = insumo(insumoId);
    var chave = l + "|" + (ins ? ins.nome : "");
    if (vistos[chave]) return;
    vistos[chave] = 1;
    saida.push({ lote:l, nome: ins ? ins.nome : "produto removido" });
  }
  (r.itens || []).forEach(function(it){ junta(it.lote, it.insumoId); });
  (r.formatos || []).forEach(function(f){
    (f.embalagem || []).forEach(function(it){ junta(it.lote, it.insumoId); });
  });
  return saida;
}
function combina(r, termo){
  if (!termo) return null;
  var t = semAcento(termo);
  if (semAcento(r.nome).indexOf(t) > -1) return "nome";
  if (semAcento(r.colecao).indexOf(t) > -1) return "coleção";
  if (semAcento(r.codigo).indexOf(t) > -1) return "lote desta produção";
  var achou = null;
  lotesDe(r).forEach(function(l){
    if (!achou && semAcento(l.lote).indexOf(t) > -1) achou = "lote " + l.lote + " de " + l.nome;
  });
  if (achou) return achou;
  var ids = {};
  (r.itens || []).forEach(function(it){ ids[it.insumoId] = 1; });
  (r.formatos || []).forEach(function(f){ (f.embalagem || []).forEach(function(it){ ids[it.insumoId] = 1; }); });
  Object.keys(ids).forEach(function(id){
    var ins = insumo(id);
    if (!achou && ins && semAcento(ins.nome).indexOf(t) > -1) achou = "usa " + ins.nome;
  });
  return achou;
}

/* ============ tela: receitas ============ */
function telaReceitas(){
  var h = '<section class="block"><h2 class="sec">Suas receitas</h2>' +
    '<p class="sec-note">Cada receita é uma massa: os produtos que você usou e os formatos que saíram dela.</p>' +
    '<button class="btn primary" data-act="nova-receita">+ Nova receita</button></section>';

  if (state.receitas.length){
    h += '<section class="block"><div class="busca">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>' +
      '<input type="search" id="campo-busca" data-busca value="' + esc(busca) + '" ' +
      'placeholder="Buscar por nome, coleção ou lote" aria-label="Buscar receitas"></div></section>';
  }

  if (!state.receitas.length){
    return h + '<section class="block"><div class="card empty"><h3>Nenhuma receita ainda</h3>' +
      '<p>Antes da primeira, cadastre na <b>Despensa</b> os produtos que você compra — base, óleo, essência, corante, embalagem. Depois é só montar a receita com eles.</p>' +
      '<div class="row-actions" style="justify-content:center; margin-top:16px">' +
        '<button class="btn" data-act="' + (temArquivos ? "arq-abrir" : "arq-input") + '">Já tenho um backup — restaurar</button>' +
      '</div>' +
      '<input type="file" id="arq-input" accept=".json,application/json" style="display:none">' +
      '</div></section>';
  }

  var termo = busca.trim();
  var motivos = {};
  var lista = state.receitas;
  if (termo){
    lista = [];
    state.receitas.forEach(function(r){
      var m = combina(r, termo);
      if (m){ motivos[r.id] = m; lista.push(r); }
    });
    h += '<section class="block"><p class="sec-note" style="margin:0">' +
      (lista.length ? lista.length + (lista.length === 1 ? ' produção encontrada' : ' produções encontradas') + ' para “' + esc(termo) + '”'
                    : 'Nenhuma produção usou “' + esc(termo) + '”.') +
      '</p></section>';
    if (!lista.length) return h;
  }

  var grupos = {}, ordem = [];
  lista.forEach(function(r){
    var c = (r.colecao || "").trim() || "Sem coleção";
    if (!grupos[c]){ grupos[c] = []; ordem.push(c); }
    grupos[c].push(r);
  });
  ordem.sort(function(a,b){
    if (a === "Sem coleção") return 1;
    if (b === "Sem coleção") return -1;
    return a.localeCompare(b, "pt-BR");
  });

  ordem.forEach(function(c){
    h += '<div class="colecao"><span class="nm">' + esc(c) + '</span><span class="ct">' +
      grupos[c].length + (grupos[c].length === 1 ? " receita" : " receitas") + '</span></div><div class="stack-sm">';
    grupos[c].forEach(function(r){
      var k = calcular(r);
      var nf = (r.formatos || []).length;
      h += '<button class="recipe" data-act="abrir" data-id="' + r.id + '">' +
        '<span><span class="nm">' + esc(r.nome || "Receita sem nome") + '</span><br>' +
        (r.codigo ? '<span class="lt">' + esc(r.codigo) + (r.data ? ' · ' + dataBR(r.data) : '') + '</span><br>' : '') +
        '<span class="mt">' + k.unidades + ' sabonetes · ' + nf + (nf === 1 ? " formato" : " formatos") +
        '<br>custa ' + money(k.custoLote) + '</span>' +
        (motivos[r.id] ? '<br><span class="lt" style="color:var(--accent)">' + esc(motivos[r.id]) + '</span>' : '') +
        '</span>' +
        '<span class="pv">' + (k.unidades
          ? '<span class="a">' + money(k.lucroLote) + '</span><br><span class="b">lucro do lote</span>'
          : '<span class="a" style="color:var(--ink-3)">—</span><br><span class="b">falta o rendimento</span>') + '</span>' +
        '</button>';
    });
    h += '</div>';
  });
  return h;
}

/* ============ ordenação da despensa ============ */
var ORDENS = [
  { id:"nome",     rot:"Nome (A–Z)" },
  { id:"caro",     rot:"Mais caro primeiro" },
  { id:"barato",   rot:"Mais barato primeiro" },
  { id:"cadastro", rot:"Ordem de cadastro" }
];

function ordemDe(onde){
  if (!state.ordem) state.ordem = {};
  return state.ordem[onde] || "nome";
}
function ordenaInsumos(lista, criterio){
  var saida = lista.slice();
  if (criterio === "cadastro") return saida;
  if (criterio === "caro" || criterio === "barato"){
    saida.sort(function(a, b){
      var d = custoBase(b) - custoBase(a);
      if (criterio === "barato") d = -d;
      return d || String(a.nome||"").localeCompare(String(b.nome||""), "pt-BR");
    });
    return saida;
  }
  if (criterio === "acabando"){
    saida.sort(function(a, b){
      function fr(i){
        var emb = porEmbalagem(i);
        return emb > 0 ? num(i.estoque) / emb : (num(i.estoque) > 0 ? Infinity : 0);
      }
      return fr(a) - fr(b) || String(a.nome||"").localeCompare(String(b.nome||""), "pt-BR");
    });
    return saida;
  }
  saida.sort(function(a, b){ return String(a.nome||"").localeCompare(String(b.nome||""), "pt-BR"); });
  return saida;
}
function insumosDe(tipo, onde){
  var lista = state.insumos.filter(function(i){ return (i.tipo || "ingrediente") === tipo; });
  return ordenaInsumos(lista, ordemDe(onde));
}
function seletorOrdem(onde, opcoesLista){
  var atual = ordemDe(onde);
  return '<div class="ordenar"><label for="ord-' + onde + '">Ordenar por</label>' +
    '<select id="ord-' + onde + '" data-ordem="' + onde + '">' +
    opcoesLista.map(function(o){
      return '<option value="' + o.id + '"' + (o.id === atual ? " selected" : "") + '>' + o.rot + '</option>';
    }).join("") + '</select></div>';
}

/* ============ cópia automática num arquivo ============ */
/* A ideia: ela escolhe UMA vez um arquivo (de preferência dentro da pasta do
   Google Drive ou do OneDrive do computador). A partir daí toda alteração é
   gravada lá também. Se o navegador for limpo, ou ela trocar de máquina,
   os dados voltam abrindo esse arquivo. */
var temArquivos = !!(window.showSaveFilePicker && window.showOpenFilePicker && window.indexedDB);
var arq = null;              // FileSystemFileHandle
var arqNome = "";
var arqQuando = "";
var arqPermitido = false;

function idb(){
  return new Promise(function(ok, erro){
    var r = indexedDB.open("saboaria-cfg", 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore("cfg"); };
    r.onsuccess = function(){ ok(r.result); };
    r.onerror = function(){ erro(r.error); };
  });
}
function idbGrava(chave, valor){
  return idb().then(function(db){
    return new Promise(function(ok, erro){
      var t = db.transaction("cfg", "readwrite");
      t.objectStore("cfg").put(valor, chave);
      t.oncomplete = ok; t.onerror = function(){ erro(t.error); };
    });
  });
}
function idbLe(chave){
  return idb().then(function(db){
    return new Promise(function(ok, erro){
      var t = db.transaction("cfg", "readonly");
      var q = t.objectStore("cfg").get(chave);
      q.onsuccess = function(){ ok(q.result); };
      q.onerror = function(){ erro(q.error); };
    });
  });
}
function permissao(h, pedir){
  if (!h || !h.queryPermission) return Promise.resolve(false);
  return h.queryPermission({mode:"readwrite"}).then(function(p){
    if (p === "granted") return true;
    if (!pedir) return false;
    return h.requestPermission({mode:"readwrite"}).then(function(q){ return q === "granted"; });
  })["catch"](function(){ return false; });
}
function escreveArquivo(){
  if (!arq || !arqPermitido) return Promise.resolve(false);
  return arq.createWritable().then(function(w){
    return w.write(JSON.stringify(state, null, 2)).then(function(){ return w.close(); });
  }).then(function(){
    arqQuando = new Date().toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
    if (view === "backup") render();
    return true;
  })["catch"](function(){
    arqPermitido = false;
    if (view === "backup") render();
    return false;
  });
}
function adotaArquivo(h){
  arq = h; arqNome = h.name;
  return idbGrava("arquivo", h).then(function(){ return permissao(h, true); })
    .then(function(ok){ arqPermitido = ok; return escreveArquivo(); })
    .then(function(){ render(); });
}
function escolherArquivo(){
  return window.showSaveFilePicker({
    suggestedName: "saboaria-maren.json",
    types: [{ description: "Backup da Saboaria", accept: {"application/json": [".json"]} }]
  }).then(adotaArquivo)["catch"](function(){});
}
function aplicaDados(novo){
  if (!novo || !Array.isArray(novo.insumos) || !Array.isArray(novo.receitas)) throw new Error("formato");
  state = migrar(novo);
  agendarSave();
}
function abrirArquivo(){
  return window.showOpenFilePicker({
    types: [{ description: "Backup da Saboaria", accept: {"application/json": [".json"]} }]
  }).then(function(hs){
    var h = hs[0];
    return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
      aplicaDados(JSON.parse(txt));
      arq = h; arqNome = h.name;
      return idbGrava("arquivo", h).then(function(){ return permissao(h, true); })
        .then(function(ok){ arqPermitido = ok; ir("receitas"); });
    });
  })["catch"](function(e){ if (e && e.name !== "AbortError") avisa("Não consegui ler esse arquivo."); });
}
function retomarArquivo(){
  if (!temArquivos) return Promise.resolve();
  return idbLe("arquivo").then(function(h){
    if (!h) return;
    arq = h; arqNome = h.name;
    return permissao(h, false).then(function(ok){ arqPermitido = ok; });
  })["catch"](function(){});
}
function baixarCopia(){
  try {
    var d = new Date();
    var nome = "saboaria-" + d.getFullYear() + "-" +
      String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0") + ".json";

/* ============ estoque ============ */
/* Regra: a receita só baixa do estoque quando ela marca "já produzi".
   O que foi baixado fica gravado em r.consumido, então editar, desmarcar
   ou excluir a receita sempre devolve exatamente o que tinha saído. */
function consumoDe(r){
  var m = {};
  (r.itens || []).forEach(function(it){
    if (!it.insumoId) return;
    m[it.insumoId] = (m[it.insumoId] || 0) + num(it.qtd);
  });
  (r.formatos || []).forEach(function(f){
    var q = Math.max(0, Math.round(num(f.qtd)));
    (f.embalagem || []).forEach(function(it){
      if (!it.insumoId) return;
      m[it.insumoId] = (m[it.insumoId] || 0) + num(it.qtd) * q;
    });
  });
  return m;
}
function sincronizaEstoque(r){
  var alvo = r.produzida ? consumoDe(r) : {};
  var antes = r.consumido || {};
  var ids = {};
  Object.keys(alvo).forEach(function(k){ ids[k] = 1; });
  Object.keys(antes).forEach(function(k){ ids[k] = 1; });
  Object.keys(ids).forEach(function(id){
    var ins = insumo(id); if (!ins) return;
    var delta = (alvo[id] || 0) - (antes[id] || 0);
    if (delta) ins.estoque = Math.round((num(ins.estoque) - delta) * 1e6) / 1e6;
  });
  r.consumido = alvo;
}
function sincronizaTudo(){
  state.receitas.forEach(function(r){
    if (r.produzida || (r.consumido && Object.keys(r.consumido).length)) sincronizaEstoque(r);
  });
}
function porEmbalagem(ins){                 // quanto vale uma embalagem, em unidade base
  var u = UNIDADES[ins.unidade] || UNIDADES.g;
  return num(ins.qtd) * u.f;
}
function podeFazer(r){
  var c = consumoDe(r);
  var ids = Object.keys(c).filter(function(k){ return c[k] > 0 && insumo(k); });
  if (!ids.length) return null;
  var vezes = Infinity, falta = [];
  ids.forEach(function(id){
    var ins = insumo(id), precisa = c[id], tem = num(ins.estoque);
    var v = Math.floor(tem / precisa);
    if (v < vezes) vezes = v;
    if (tem < precisa) falta.push({ ins: ins, quanto: precisa - tem });
  });
  return { vezes: isFinite(vezes) ? Math.max(0, vezes) : 0, falta: falta };
}
function qtdTexto(v, base){
  if (base === "un") return dec(v, 0) + " un";
  if (Math.abs(v) >= 1000) return dec(v / 1000, 2) + " " + (base === "g" ? "kg" : "L");
  return dec(v, Math.abs(v) < 100 ? 1 : 0) + " " + base;   // sobras pequenas pedem a casa decimal
}

/* ============ lote proporcional (regra de três) ============ */
/* A sobra manda: o ingrediente que rende a menor fração da receita
   determina o tamanho da fornada, e todo o resto é multiplicado
   pelo mesmo fator. */
var escala = null;
var escalaRec = null;

function ingredientesDaMassa(r){
  return (r.itens || []).filter(function(it){ return it.insumoId && num(it.qtd) > 0 && insumo(it.insumoId); });
}
function pesoDaMassa(r, fator){
  var t = 0;
  ingredientesDaMassa(r).forEach(function(it){
    var b = baseDe(insumo(it.insumoId));
    if (b === "g" || b === "ml") t += num(it.qtd) * (fator == null ? 1 : fator);
  });
  return t;
}
function abreEscala(r){
  var sobras = {};
  ingredientesDaMassa(r).forEach(function(it){
    var ins = insumo(it.insumoId);
    sobras[it.insumoId] = br(Math.round(num(ins.estoque) * 1000) / 1000);   // parte do estoque atual
  });
  escala = { modo:"sobra", sobras:sobras, pct:"", peso:"", trabalho:"igual" };
}
function fatorDaEscala(r){
  if (!escala) return { fator:0, limita:null };
  if (escala.modo === "pct"){
    return { fator: Math.max(0, num(escala.pct)) / 100, limita:null };
  }
  if (escala.modo === "peso"){
    var cheio = pesoDaMassa(r, 1);
    return { fator: cheio > 0 ? Math.max(0, num(escala.peso)) / cheio : 0, limita:null };
  }
  var menor = Infinity, quem = null;
  ingredientesDaMassa(r).forEach(function(it){
    var pede = num(it.qtd);
    var f = pede > 0 ? num(escala.sobras[it.insumoId]) / pede : Infinity;
    if (f < menor){ menor = f; quem = it.insumoId; }
  });
  return { fator: isFinite(menor) ? Math.max(0, menor) : 0, limita: quem };
}
function receitaEscalada(r, fator){
  var nova = JSON.parse(JSON.stringify(r));
  nova.id = uid();
  nova.data = hoje();
  nova.codigo = codigoSugerido(nova);
  nova.produzida = false;
  nova.consumido = {};
  nova.nome = (r.nome || "Receita") + " · " + dec(fator * 100, 0) + "%";
  nova.itens = (nova.itens || []).map(function(it){
    var ins = insumo(it.insumoId);
    return { insumoId: it.insumoId,
             qtd: br(Math.round(num(it.qtd) * fator * 100) / 100),
             lote: ins ? (ins.lote || "") : "" };          // lote do pacote aberto hoje
  });
  nova.formatos = (nova.formatos || []).map(function(f){
    return { id: uid(), nome: f.nome, peso: f.peso,
             qtd: String(Math.max(0, Math.floor(num(f.qtd) * fator))),
             precoPraticado: "",
             embalagem: (f.embalagem || []).map(function(e){
               var ie = insumo(e.insumoId);
               return { insumoId: e.insumoId, qtd: e.qtd, lote: ie ? (ie.lote || "") : "" };
             }) };
  });
  if (escala && escala.trabalho === "proporcional"){
    nova.trabalhoValor = br(Math.round(num(r.trabalhoValor) * fator * 100) / 100);
  }
  return nova;
}

        esc(x.nome || "Receita sem nome") + '</option>';
    });
    opt += '</optgroup>';
  });

  h += '<section class="block"><div class="card">' +
    '<label for="esc-receita">Receita padrão</label>' +
    '<select id="esc-receita" data-esc-receita>' + opt.replace('value="__nova__"', 'value="__nova__"' + (novaBase ? " selected" : "")) + '</select>' +
    (r ? '' : '<p class="sec-note" style="margin:10px 0 0">Assim que escolher, aparece aqui o que ela pede e onde você preenche o que tem.</p>') +
    '</div></section>';

  if (novaBase) return h + formNovaBase();
  if (!r) return h;
  if (!escala) abreEscala(r);
  return h + painelEscala(r);
}

function painelEscala(r){
  var lista = ingredientesDaMassa(r);
  var e = fatorDaEscala(r);
  var fator = e.fator;
  var pct = fator * 100;

  var s = '<section class="block"><div class="card stack">' +
    '<div class="seg">' +
      '<button data-seg-esc="sobra" aria-pressed="' + (escala.modo === "sobra") + '">Pela sobra</button>' +
      '<button data-seg-esc="pct" aria-pressed="' + (escala.modo === "pct") + '">Porcentagem</button>' +
      '<button data-seg-esc="peso" aria-pressed="' + (escala.modo === "peso") + '">Peso da massa</button>' +
    '</div>';

  if (!lista.length){
    return s + '<p class="sec-note" style="margin:0">Esta receita ainda não tem ingredientes lançados, então não há o que reduzir. Abra ela em <b>Receitas</b> e preencha a massa primeiro.</p></div></section>';
  }

  if (escala.modo === "sobra"){
    s += '<div>';
    lista.forEach(function(it){
      var ins = insumo(it.insumoId), base = baseDe(ins);
      var pede = num(it.qtd), tem = num(escala.sobras[it.insumoId]);
      var f = pede > 0 ? tem / pede : 0;
      var limita = e.limita === it.insumoId;
      s += '<div class="esc-linha' + (limita ? " limita" : "") + '">' +
        '<div><span class="nm">' + esc(ins.nome || "Sem nome") + '</span>' +
          '<span class="pede">a receita pede ' + qtdTexto(pede, base) + '</span></div>' +
        '<div class="campo"><input class="num" inputmode="decimal" type="text" data-sobra="' + it.insumoId +
          '" value="' + esc(escala.sobras[it.insumoId] || "") + '" placeholder="0" aria-label="Quanto você tem de ' + esc(ins.nome) + '">' +
          '<span class="un">' + base + '</span></div>' +
        '<div class="frac">' + dec(f * 100, 0) + '%</div>' +
        (limita ? '<div class="esc-aviso">este acaba primeiro — é ele que manda</div>' : '') +
        '</div>';
    });
    s += '</div><p class="sec-note" style="margin:0">Os valores vêm do seu estoque. Ajuste para o que realmente sobrou no frasco.</p>';
  } else if (escala.modo === "pct"){
    s += '<div><label for="esc-pct">Quantos % da receita padrão</label>' +
      '<input id="esc-pct" class="num" inputmode="decimal" type="text" data-esc="pct" value="' + esc(escala.pct) + '" placeholder="30"></div>';
  } else {
    s += '<div><label for="esc-peso">Peso da massa que você quer (g)</label>' +
      '<input id="esc-peso" class="num" inputmode="decimal" type="text" data-esc="peso" value="' + esc(escala.peso) + '" placeholder="' + dec(pesoDaMassa(r, 1), 0) + '"></div>' +
      '<p class="sec-note" style="margin:0">A receita cheia dá ' + dec(pesoDaMassa(r, 1), 0) + ' g de massa.</p>';
  }

  s += '<div class="esc-fator"><span class="big">' + dec(pct, pct < 10 ? 1 : 0) + '%</span>' +
    '<span class="txt">da receita padrão' + (e.limita ? ' — limitado por ' + esc((insumo(e.limita) || {}).nome || "") : '') + '</span></div>';

  if (fator > 0){
    var nova = receitaEscalada(r, fator);
    var k = calcular(nova);
    s += '<div class="esc-prev">';
    s += '<div class="tt">vai usar</div>';
    nova.itens.forEach(function(it){
      var ins = insumo(it.insumoId);
      s += '<div class="par"><span>' + esc(ins ? ins.nome : "") + '</span><b>' + qtdTexto(num(it.qtd), baseDe(ins)) + '</b></div>';
    });
    s += '<div class="tt">vai render</div>';
    var algum = false;
    nova.formatos.forEach(function(f){
      var q = num(f.qtd);
      if (q > 0) algum = true;
      s += '<div class="par"><span>' + esc(f.nome || "Formato") + ' · ' + dec(num(f.peso), 0) + ' g</span><b>' +
        dec(q, 0) + (q === 1 ? " sabonete" : " sabonetes") + '</b></div>';
    });
    if (!algum) s += '<div class="hint warn">A sobra não dá para nenhum sabonete inteiro nos formatos desta receita. Aumente a sobra ou use um formato menor.</div>';
    s += '<div class="par" style="border-top:1px solid var(--line); margin-top:6px; padding-top:10px"><span>Custo deste lote</span><b>' + money(k.custoLote) + '</b></div>';
    if (k.formatos.length && k.unidades > 0){
      s += '<div class="par"><span>Custo de cada sabonete</span><b>' +
        k.formatos.filter(function(x){ return x.qtd > 0; }).map(function(x){ return money(x.custoUn); }).join(" · ") + '</b></div>';
    }
    s += '</div>';

    s += '<div><label>Seu trabalho neste lote menor</label><div class="seg">' +
      '<button data-seg-trab="igual" aria-pressed="' + (escala.trabalho !== "proporcional") + '">o mesmo do lote cheio</button>' +
      '<button data-seg-trab="proporcional" aria-pressed="' + (escala.trabalho === "proporcional") + '">proporcional</button>' +
      '</div>' +
      '<p class="sec-note" style="margin:8px 0 0">Preparar, derreter e desenformar leva quase o mesmo tempo num lote pequeno. Mantendo o valor cheio, o preço do sabonete pequeno sai mais honesto.</p></div>';

    s += '<button class="btn primary grande" data-act="esc-criar">Criar esta produção</button>';
  } else {
    s += '<div class="hint">' + (escala.modo === "sobra"
      ? 'Preencha ao lado quanto você tem de cada ingrediente. O menor deles define o tamanho da fornada.'
      : 'Informe um valor acima para o app montar a fornada.') + '</div>';
  }

  return s + '</div></section>';
}

/* ============ tela: em estoque ============ */
function telaEstoque(){
  if (!state.insumos.length){
    return '<section class="block"><h2 class="sec">Em estoque</h2>' +
      '<div class="card empty"><h3>Nada para contar ainda</h3>' +
      '<p>Cadastre seus produtos na <b>Despensa</b> primeiro. Depois volte aqui para dizer quanto você tem de cada um.</p></div></section>';
  }

  var valor = 0, acabando = 0;
  state.insumos.forEach(function(i){
    var e = num(i.estoque);
    valor += e * custoBase(i);
    if (e <= 0 || e < porEmbalagem(i)) acabando++;
  });

  var h = '<section class="block"><h2 class="sec">Em estoque</h2>' +
    '<p class="sec-note">Quanto você ainda tem de cada produto. As receitas marcadas como produzidas descontam daqui sozinhas.</p>' +
    (state.insumos.length > 1 ? seletorOrdem("estoque", ORDENS_ESTOQUE) : '') +
    '<div class="card"><div class="bar-in" style="display:grid; grid-template-columns:1fr 1fr; gap:12px">' +
      '<div class="stat"><div class="kk">valor parado</div><div class="vv">' + money(valor) + '</div></div>' +
      '<div class="stat end"><div class="kk">produtos acabando</div><div class="vv" style="color:' +
        (acabando ? "var(--bad)" : "var(--good)") + '">' + acabando + '</div></div>' +
    '</div></div></section>';

  var negativos = 0;
  state.insumos.forEach(function(i){ if (num(i.estoque) < 0) negativos++; });
  if (negativos){
    h += '<section class="block"><div class="hint">Alguns saldos estão negativos: há produções marcadas como feitas que gastaram mais do que o app sabia que existia. Lance aí embaixo o que você realmente tem em casa e os números se acertam.</div></section>';
  }

  h += bloco("Ingredientes", "ingrediente");
  h += bloco("Embalagem e rótulo", "embalagem");
  h += secPodeFazer();
  return h;

  function bloco(titulo, tipo){
    var lista = insumosDe(tipo, "estoque");
    if (!lista.length) return "";
    var s = '<section class="block"><h2 class="sec">' + titulo + '</h2><div class="card">';
    lista.forEach(function(ins){
      var base = baseDe(ins), e = num(ins.estoque), emb = porEmbalagem(ins);
      var estado = e < 0 ? '<span class="pill bad">falta registrar entrada</span>'
        : (e === 0 ? '<span class="pill bad">acabou</span>'
        : (emb > 0 && e < emb ? '<span class="pill" style="background:var(--ouro-soft); color:var(--ouro)">menos de uma embalagem</span>'
        : '<span class="pill good">ok</span>'));
      var quantas = emb > 0 ? dec(e / emb, 1) + (Math.abs(e/emb) === 1 ? " embalagem" : " embalagens") : "";
      s += '<div class="est">' +
        '<div><div class="nm">' + esc(ins.nome || "Sem nome") + '</div>' +
          '<div class="dt">' + qtdTexto(e, base) + (quantas ? ' · ' + quantas : '') + '</div></div>' +
        '<div class="val">' + money(e * custoBase(ins)) + '<br><span style="font-size:11px">parado</span></div>' +
        '<div class="acoes">' +
          '<div class="campo"><input class="num" inputmode="decimal" type="text" data-est="' + ins.id +
            '" value="' + (e ? esc(br(Math.round(e * 1000) / 1000)) : "") + '" placeholder="0" aria-label="Estoque de ' + esc(ins.nome) + '">' +
            '<span class="un">' + base + '</span></div>' +
          '<button class="tiny" data-act="est-mais" data-id="' + ins.id + '">+ 1 embalagem (' +
            dec(num(ins.qtd), 3) + ' ' + (UNIDADES[ins.unidade] || UNIDADES.g).rot + ')</button>' +
          estado +
        '</div></div>';
    });
    return s + '</div></section>';
  }

  function secPodeFazer(){
    if (!state.receitas.length) return "";
    var contou = false;
    state.insumos.forEach(function(i){ if (num(i.estoque) > 0) contou = true; });
    if (!contou){
      return '<section class="block"><h2 class="sec">O que dá para fazer</h2>' +
        '<div class="card"><p class="sec-note" style="margin:0">Assim que você disser quanto tem de cada produto aí em cima, esta lista mostra quantos lotes de cada receita saem com o que há em casa — e o que falta comprar para as que não fecham.</p></div></section>';
    }
    var s = '<section class="block"><h2 class="sec">O que dá para fazer</h2>' +
      '<p class="sec-note">Com o que tem em casa agora, quantas vezes cada receita sai inteira.</p><div class="card">';
    var houve = false;
    state.receitas.forEach(function(r){
      var p = podeFazer(r);
      if (!p) return;
      houve = true;
      s += '<div class="faz"><span class="nm">' + esc(r.nome || "Receita sem nome") + '</span>';
      if (p.vezes >= 1){
        s += '<span class="qt" style="color:var(--good)">dá para ' + p.vezes + (p.vezes === 1 ? " lote" : " lotes") + '</span>';
      } else {
        s += '<span class="qt" style="color:var(--bad)">falta produto</span>';
        s += '<span class="falta">precisa comprar: ' + p.falta.map(function(f){
          return qtdTexto(f.quanto, baseDe(f.ins)) + " de " + esc(f.ins.nome);
        }).join(" · ") + '</span>';
      }
      s += '</div>';
    });
    if (!houve) s += '<p style="margin:2px 0; color:var(--ink-3); font-size:14px">Nenhuma receita tem ingredientes lançados ainda.</p>';
    return s + '</div></section>';
  }
}



/* ============ kits ============ */
function kitAtual(){
  var lista = state.kits || [];
  for (var i=0;i<lista.length;i++) if (lista[i].id === editId) return lista[i];
  return null;
}
function formatoDoKit(it){
  for (var i=0;i<state.receitas.length;i++){
    var r = state.receitas[i];
    if (r.id !== it.receitaId) continue;
    var k = calcular(r), achou = null;
    k.formatos.forEach(function(c){ if (c.ref.id === it.formatoId) achou = c; });
    if (achou) return { receita:r, c:achou };
  }
  return null;
}
function calcularKit(kit){
  var o = { itens:0, trabalho:0, custo:0, pecas:0, linhas:[] };
  (kit.itens || []).forEach(function(it){
    var q = num(it.qtd);
    var l = { qtd:q, ok:false, tipo:it.tipo, nome:"", det:"", unit:0, total:0, un:"un" };
    if (it.tipo === "insumo"){
      var ins = insumo(it.insumoId);
      if (ins){
        l.ok = true; l.nome = ins.nome || "Sem nome"; l.unit = custoBase(ins); l.un = baseDe(ins);
        l.det = moneyFine(l.unit) + " por " + l.un + " · da despensa";
      } else l.det = it.insumoId ? "este produto foi apagado da despensa" : "escolha um item da despensa";
    } else {
      var f = formatoDoKit(it);
      if (f){
        l.ok = true;
        l.nome = (f.c.nome || "Formato") + " · " + (f.receita.nome || "receita sem nome");
        l.unit = f.c.custoUn;
        l.det = (f.receita.nome || "receita sem nome") + " · " + money(l.unit) + " cada, já com massa, embalagem e trabalho";
      } else l.det = it.receitaId ? "esta receita ou formato não existe mais" : "escolha o que vai no kit";
    }
    l.total = l.unit * q;
    o.itens += l.total;
    o.pecas += q;
    o.linhas.push(l);
  });
  o.trabalho = num(kit.trabalhoValor);
  o.custo = o.itens + o.trabalho;
  o.sugerido = precificar(o.custo, kit);
  o.praticado = num(kit.precoPraticado);
  o.preco = o.praticado > 0 ? o.praticado : o.sugerido;
  o.lucro = o.preco - o.custo;
  o.margem = o.preco > 0 ? (o.lucro / o.preco) * 100 : 0;
  return o;
}
function novoKit(){
  return { id:uid(), nome:"", data:hoje(), itens:[], trabalhoValor:"",
           precoModo:"multiplicador", precoValor:2, precoPraticado:"" };
}
function linhaConta(a, b){
  return '<div class="line"><span class="k">' + a + '</span><span class="v">' + b + '</span></div>';
}
function opcoesFormatosKit(it){
  var s = '<option value="">Escolha o que vai dentro…</option>';
  state.receitas.forEach(function(r){
    var k = calcular(r);
    if (!k.formatos.length) return;
    s += '<optgroup label="' + esc(r.nome || "Receita sem nome") + '">';
    k.formatos.forEach(function(c){
      var val = r.id + "|" + c.ref.id;
      var sel = (it.receitaId === r.id && it.formatoId === c.ref.id) ? " selected" : "";
      s += '<option value="' + val + '"' + sel + '>' + esc(c.nome || "Formato") + ' — ' + money(c.custoUn) + ' cada</option>';
    });
    s += '</optgroup>';
  });
  return s;
}
function opcoesDespensaKit(it){
  var s = '<option value="">Escolha da despensa…</option>';
  [["embalagem", "Embalagem e rótulo"], ["ingrediente", "Ingredientes"]].forEach(function(par){
    var lista = state.insumos.filter(function(i){ return (i.tipo || "ingrediente") === par[0]; });
    if (!lista.length) return;
    lista = lista.slice().sort(function(a, b){ return String(a.nome||"").localeCompare(String(b.nome||""), "pt-BR"); });
    s += '<optgroup label="' + par[1] + '">';
    lista.forEach(function(i){
      s += '<option value="' + i.id + '"' + (it.insumoId === i.id ? " selected" : "") + '>' + esc(i.nome || "Sem nome") + '</option>';
    });
    s += '</optgroup>';
  });
  return s;
}

    '<div class="line total"><span class="k">Custo do kit</span><span class="v">' + money(c.custo) + '</span></div>' +
    linhaConta("Preço de venda", money(c.preco)) +
    linhaConta("Lucro por kit", money(c.lucro)) +
    linhaConta("Quanto do preço fica com você", dec(c.margem, 0) + "%") +
    '</div></div></section>';

  h += '<section class="block">' +
    '<button class="btn primary grande" data-act="kit-salvar">Salvar kit</button>' +
    '<p class="sec-note" style="margin:10px 0 0; text-align:center">Tudo já vai sendo guardado enquanto você digita. Este botão só fecha o kit e volta para a lista.</p>' +
    '</section>';

  h += '<section class="block"><div class="row-actions">' +
    '<button class="btn" data-act="kit-duplicar" data-id="' + kit.id + '">Duplicar kit</button>' +
    (confirmando === "kit:" + kit.id
      ? '<button class="btn" data-act="kit-excluir" data-id="' + kit.id + '" style="color:var(--bad); border-color:var(--bad)">Confirmar exclusão</button><button class="btn" data-act="cancelar">Cancelar</button>'
      : '<button class="btn" data-act="kit-perguntar" data-id="' + kit.id + '">Excluir kit</button>') +
    '</div></section>';

  return h;
}

/* ============ tela: backup ============ */

      '<p class="sec-note" style="margin:8px 0 0">O navegador pede sua permissão de novo para gravar no arquivo. Um clique e ela volta a funcionar.</p></div>' +

  h += '<section class="block"><div class="card">' +
