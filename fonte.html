/* ============ aviso flutuante ============ */
var toastEl = null, toastTimer = null;
function toast(txt, aviso){
  if (!toastEl){
    toastEl = document.createElement("div");
    toastEl.className = "toast";
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = txt;
  toastEl.className = "toast" + (aviso ? " aviso" : "");
  void toastEl.offsetWidth;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, aviso ? 3200 : 2400);
}

/* ============ eventos ============ */
function novoFormato(nome){
  return { id:uid(), nome:nome || "", peso:"", qtd:"", embalagem:[], precoPraticado:"" };
}

document.addEventListener("click", function(ev){
  var nav = ev.target.closest("nav button[data-nav]");
  if (nav){ formAberto = null; ir(nav.dataset.nav); return; }

  var selRec = ev.target.closest("[data-esc-receita]");
  if (selRec) return;   // tratado no change

  var segE = ev.target.closest("[data-seg-esc]");
  if (segE){ if (escala){ escala.modo = segE.dataset.segEsc; render(); } return; }
  var segT = ev.target.closest("[data-seg-trab]");
  if (segT){ if (escala){ escala.trabalho = segT.dataset.segTrab; render(); } return; }

  var segK = ev.target.closest("[data-seg-kit]");
  if (segK){
    var kSeg = kitAtual();
    if (kSeg){ kSeg[segK.dataset.segKit] = segK.dataset.val; agendarSave(); render(); }
    return;
  }

  var seg = ev.target.closest("[data-seg]");
  if (seg){
    var r0 = receita();
    if (r0){ r0[seg.dataset.seg] = seg.dataset.val; agendarSave(); render(); }
    return;
  }

  var b = ev.target.closest("[data-act]");
  if (!b) return;
  var act = b.dataset.act;
  var r = receita();

  if (act === "tema"){ alternaTema(); return; }
  if (act === "marca"){ repeteMarca(); return; }

  if (act === "cancelar"){ confirmando = null; formAberto = null; render(); return; }
  if (act === "voltar"){ formAberto = null; ir("receitas"); return; }

  if (act === "nova-receita"){
    var nova = { id:uid(), nome:"", colecao:"", data:hoje(), codigo:"", itens:[], formatos:[novoFormato("")],
      trabalhoValor:"", trabalhoModo:"lote", precoModo:"multiplicador", precoValor:2 };
    nova.codigo = codigoSugerido(nova);
    state.receitas.unshift(nova); agendarSave(); ir("editor", nova.id);
    setTimeout(function(){ var e = document.getElementById("r-nome"); if (e) e.focus(); }, 40);
    return;
  }
  if (act === "abrir"){ ir("editor", b.dataset.id); return; }

  if (act === "kit-novo"){
    if (!Array.isArray(state.kits)) state.kits = [];
    var nk = novoKit();
    state.kits.unshift(nk); agendarSave(); ir("kit", nk.id);
    setTimeout(function(){ var e = document.getElementById("k-nome"); if (e) e.focus(); }, 40);
    return;
  }
  if (act === "kit-abrir"){ ir("kit", b.dataset.id); return; }
  if (act === "kit-voltar" || act === "kit-salvar"){ ir("kits"); return; }
  if (act === "kit-add-formato"){
    var ka = kitAtual();
    if (ka){ ka.itens.push({ tipo:"formato", receitaId:"", formatoId:"", qtd:"1" }); agendarSave(); render(); }
    return;
  }
  if (act === "kit-add-insumo"){
    var kb = kitAtual();
    if (kb){ kb.itens.push({ tipo:"insumo", insumoId:"", qtd:"1" }); agendarSave(); render(); }
    return;
  }
  if (act === "kit-rm"){
    var kc = kitAtual();
    if (kc){ kc.itens.splice(parseInt(b.dataset.idx, 10), 1); agendarSave(); render(); }
    return;
  }
  if (act === "kit-duplicar"){
    var kd = kitAtual(); if (!kd) return;
    var cop2 = JSON.parse(JSON.stringify(kd));
    cop2.id = uid(); cop2.nome = (kd.nome || "Kit") + " (cópia)"; cop2.data = hoje();
    state.kits.unshift(cop2); agendarSave(); ir("kit", cop2.id); return;
  }
  if (act === "kit-perguntar"){ confirmando = "kit:" + b.dataset.id; render(); return; }
  if (act === "kit-excluir"){
    var idk = b.dataset.id;
    state.kits = (state.kits || []).filter(function(x){ return x.id !== idk; });
    confirmando = null; agendarSave(); ir("kits");
    toast("Kit excluído"); return;
  }
  if (act === "duplicar"){
    if (!r) return;
    var cop = JSON.parse(JSON.stringify(r));
    cop.id = uid(); cop.nome = (r.nome || "Receita") + " (cópia)";
    cop.produzida = false; cop.consumido = {};   // a cópia é uma nova fornada
    cop.data = hoje(); cop.codigo = codigoSugerido(cop);
    (cop.formatos || []).forEach(function(f){ f.id = uid(); });
    state.receitas.unshift(cop); agendarSave(); ir("editor", cop.id); return;
  }
  if (act === "nb-add"){
    if (!novaBase) return;
    var pri = state.insumos.filter(function(i){ return (i.tipo || "ingrediente") === "ingrediente"; })[0];
    if (pri) novaBase.itens.push({ insumoId: pri.id, qtd: "" });
    render(); return;
  }
  if (act === "nb-remover"){
    if (!novaBase) return;
    novaBase.itens.splice(parseInt(b.dataset.idx, 10), 1);
    render(); return;
  }
  if (act === "nb-abrir"){ abreNovaBase(); escalaRec = null; escala = null; render(); return; }
  if (act === "nb-cancelar"){ novaBase = null; render(); return; }
  if (act === "nb-criar"){
    if (!novaBase) return;
    var nomeBase = (novaBase.nome || "").trim();
    if (!nomeBase){
      var cn = document.getElementById("nb-nome");
      if (cn) cn.focus();
      toast("Dê um nome para a receita base.", true);
      return;
    }
    var validos = novaBase.itens.filter(function(it){ return it.insumoId && num(it.qtd) > 0; });
    if (!validos.length){ toast("Lance pelo menos um ingrediente com quantidade.", true); return; }

    var base = { id:uid(), nome:nomeBase, colecao:(novaBase.colecao || "").trim(),
      data:hoje(), codigo:"",
      itens: validos.map(function(it){
        var ii = insumo(it.insumoId);
        return { insumoId: it.insumoId, qtd: it.qtd, lote: ii ? (ii.lote || "") : "" };
      }),
      formatos: [{ id:uid(), nome:"Padrão", peso: novaBase.peso, qtd: novaBase.qtd,
                   embalagem: [], precoPraticado: "" }],
      trabalhoValor:"", trabalhoModo:"lote", precoModo:"multiplicador", precoValor:2,
      produzida:false, consumido:{} };
    base.codigo = codigoSugerido(base);
    state.receitas.unshift(base);
    novaBase = null;
    escalaRec = base.id;
    abreEscala(base);
    agendarSave(); render();
    toast("“" + nomeBase + "” criada como padrão");
    return;
  }

  if (act === "esc-criar"){
    var padrao = null;
    state.receitas.forEach(function(x){ if (x.id === escalaRec) padrao = x; });
    if (!padrao) return;
    var e = fatorDaEscala(padrao);
    if (!(e.fator > 0)) return;
    var nova = receitaEscalada(padrao, e.fator);
    state.receitas.unshift(nova);
    escala = null;
    agendarSave();
    ir("editor", nova.id);
    toast("Produção de " + dec(e.fator * 100, 0) + "% criada");
    return;
  }

  if (act === "est-mais"){
    var im = insumo(b.dataset.id);
    if (im){ im.estoque = num(im.estoque) + porEmbalagem(im); agendarSave(); render(); }
    return;
  }
  if (act === "rec-produzida"){
    if (!r) return;
    r.produzida = !!b.checked;
    sincronizaEstoque(r);
    agendarSave(); render();
    toast(r.produzida ? "Descontado do estoque" : "Devolvido ao estoque");
    return;
  }

  if (act === "rec-salvar"){
    if (!r) return;
    var nome = (r.nome || "").trim();
    if (!nome){
      window.scrollTo({top:0, behavior:"smooth"});
      var campo = document.getElementById("r-nome");
      if (campo) campo.focus();
      toast("Dê um nome para a receita antes de salvar.", true);
      return;
    }
    clearTimeout(saveTimer);          // não espera o intervalo: grava agora
    state.updatedAt = new Date().toISOString();
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
    gravar();
    ir("receitas");
    toast("\u201C" + nome + "\u201D salva");
    return;
  }
  if (act === "rec-perguntar"){ confirmando = "rec:" + b.dataset.id; render(); return; }
  if (act === "rec-excluir"){
    var aExcluir = null;
    state.receitas.forEach(function(x){ if (x.id === b.dataset.id) aExcluir = x; });
    if (aExcluir){ aExcluir.produzida = false; sincronizaEstoque(aExcluir); }   // devolve o que saiu
    state.receitas = state.receitas.filter(function(x){ return x.id !== b.dataset.id; });
    agendarSave(); ir("receitas"); return;
  }

  if (act === "item-add"){
    if (!r) return;
    var pri = state.insumos.filter(function(i){ return (i.tipo || "ingrediente") === "ingrediente"; })[0];
    if (!pri) return;
    r.itens = r.itens || [];
    r.itens.push({ insumoId:pri.id, qtd:"", lote: pri.lote || "" });
    agendarSave(); render(); return;
  }
  if (act === "item-remover"){
    if (!r) return;
    r.itens.splice(parseInt(b.dataset.idx, 10), 1);
    agendarSave(); render(); return;
  }

  if (act === "fmt-add"){
    if (!r) return;
    r.formatos = r.formatos || [];
    r.formatos.push(novoFormato(""));
    agendarSave(); render();
    setTimeout(function(){
      var campos = document.querySelectorAll('[data-k="nome"][data-f]');
      var ultimo = campos[campos.length - 1];
      if (ultimo){ ultimo.focus(); ultimo.scrollIntoView({block:"center"}); }
    }, 40);
    return;
  }
  if (act === "fmt-remover"){
    if (!r) return;
    r.formatos.splice(parseInt(b.dataset.idx, 10), 1);
    agendarSave(); render(); return;
  }
  if (act === "emb-add"){
    if (!r) return;
    var f = r.formatos[parseInt(b.dataset.fmt, 10)]; if (!f) return;
    var pe = state.insumos.filter(function(i){ return i.tipo === "embalagem"; })[0];
    if (!pe) return;
    f.embalagem = f.embalagem || [];
    f.embalagem.push({ insumoId:pe.id, qtd:1, lote: pe.lote || "" });
    agendarSave(); render(); return;
  }
  if (act === "emb-remover"){
    if (!r) return;
    var f2 = r.formatos[parseInt(b.dataset.fmt, 10)]; if (!f2) return;
    f2.embalagem.splice(parseInt(b.dataset.idx, 10), 1);
    agendarSave(); render(); return;
  }

  if (act === "usar-sugerido"){
    if (!r) return;
    var fs = r.formatos[parseInt(b.dataset.idx, 10)]; if (!fs) return;
    fs.precoPraticado = "";
    var campo = document.querySelector('[data-p="' + b.dataset.idx + '"]');
    if (campo) campo.value = "";
    agendarSave(); atualizarFormatos(); return;
  }

  if (act === "ins-novo"){ formAberto = "novo:" + b.dataset.tipo; confirmando = null; render(); return; }
  if (act === "ins-editar"){ formAberto = b.dataset.id; confirmando = null; render(); return; }
  if (act === "ins-perguntar"){ confirmando = "ins:" + b.dataset.id; render(); return; }
  if (act === "ins-excluir"){
    var id = b.dataset.id;
    state.insumos = state.insumos.filter(function(x){ return x.id !== id; });
    state.receitas.forEach(function(rr){
      rr.itens = (rr.itens || []).filter(function(i){ return i.insumoId !== id; });
      (rr.formatos || []).forEach(function(f3){
        f3.embalagem = (f3.embalagem || []).filter(function(i){ return i.insumoId !== id; });
      });
    });
    confirmando = null; agendarSave(); render(); return;
  }
  if (act === "ins-salvar"){
    var nome = (document.getElementById("f-nome").value || "").trim();
    if (!nome){ document.getElementById("f-nome").focus(); return; }
    var qtd = num(document.getElementById("f-qtd").value);
    var unidade = document.getElementById("f-un").value;
    var preco = num(document.getElementById("f-preco").value);
    var campoLote = document.getElementById("f-lote");
    var lote = campoLote ? (campoLote.value || "").trim() : "";
    var alvo = b.dataset.id ? insumo(b.dataset.id) : null;
    if (alvo){ alvo.nome = nome; alvo.qtd = qtd; alvo.unidade = unidade; alvo.preco = preco; alvo.lote = lote; }
    else state.insumos.push({ id:uid(), tipo:b.dataset.tipo, nome:nome, qtd:qtd, unidade:unidade, preco:preco, lote:lote });
    formAberto = null; agendarSave(); render(); return;
  }

  if (act === "arq-escolher"){ escolherArquivo(); return; }
  if (act === "arq-abrir"){ abrirArquivo(); return; }
  if (act === "arq-retomar"){
    permissao(arq, true).then(function(ok){ arqPermitido = ok; return escreveArquivo(); }).then(function(){ render(); });
    return;
  }
  if (act === "arq-input"){ var ii = document.getElementById("arq-input"); if (ii) ii.click(); return; }
  if (act === "bk-baixar"){ baixarCopia(); return; }

  if (act === "bk-copiar"){
    var ta = document.getElementById("bk");
    ta.select(); ta.setSelectionRange(0, 999999);
    try { document.execCommand("copy"); } catch(e){}
    if (navigator.clipboard) { try { navigator.clipboard.writeText(ta.value); } catch(e){} }
    b.textContent = "Copiado";
    setTimeout(function(){ b.textContent = "Copiar"; }, 1600);
    return;
  }
  if (act === "bk-restaurar"){
    try {
      var novo = JSON.parse(document.getElementById("bk").value);
      if (!novo || !Array.isArray(novo.insumos) || !Array.isArray(novo.receitas)) throw new Error("formato");
      state = migrar(novo); agendarSave(); ir("receitas");
    } catch(e){
      b.textContent = "Texto inválido";
      setTimeout(function(){ b.textContent = "Restaurar a partir deste texto"; }, 2200);
    }
    return;
  }
});

document.addEventListener("change", function(ev){
  if (ev.target && ev.target.hasAttribute && ev.target.hasAttribute("data-esc-receita")){
    if (ev.target.value === "__nova__"){ abreNovaBase(); escalaRec = null; escala = null; render(); return; }
    novaBase = null;
    escalaRec = ev.target.value || null;
    escala = null;
    if (escalaRec){
      var alvo = null;
      state.receitas.forEach(function(x){ if (x.id === escalaRec) alvo = x; });
      if (alvo) abreEscala(alvo);
    }
    render();
    return;
  }
  if (ev.target && ev.target.dataset && ev.target.dataset.ordem){
    if (!state.ordem) state.ordem = {};
    state.ordem[ev.target.dataset.ordem] = ev.target.value;
    agendarSave(); render();
    return;
  }
  if (ev.target && ev.target.id === "arq-input" && ev.target.files && ev.target.files[0]){
    var leitor = new FileReader();
    leitor.onload = function(){
      try { aplicaDados(JSON.parse(leitor.result)); ir("receitas"); }
      catch(e){ avisa("Não consegui ler esse arquivo."); }
    };
    leitor.readAsText(ev.target.files[0]);
  }
});

var timerCampo = null;
function renderDepois(seletor){          // re-render sem atropelar quem está digitando
  clearTimeout(timerCampo);
  timerCampo = setTimeout(function(){
    render();
    var c = document.querySelector(seletor);
    if (c){ c.focus(); try { c.setSelectionRange(c.value.length, c.value.length); } catch(e){} }
  }, 500);
}

document.addEventListener("input", function(ev){
  var t = ev.target, r = receita();
  if (t.dataset && t.dataset.nb){
    if (novaBase){ novaBase[t.dataset.nb] = t.value; }
    return;
  }
  if (t.dataset && t.dataset.nbi != null && t.dataset.nbi !== ""){
    if (novaBase){
      var itb = novaBase.itens[parseInt(t.dataset.nbi, 10)];
      if (itb){
        itb[t.dataset.k] = t.value;
        if (t.dataset.k === "insumoId") render();
      }
    }
    return;
  }
  if (t.dataset && t.dataset.ki != null && t.dataset.ki !== ""){
    var kEd = kitAtual(); if (!kEd) return;
    var itK = (kEd.itens || [])[parseInt(t.dataset.ki, 10)]; if (!itK) return;
    if (t.dataset.k === "ref"){
      if (itK.tipo === "insumo") itK.insumoId = t.value;
      else {
        var par = String(t.value).split("|");
        itK.receitaId = par[0] || ""; itK.formatoId = par[1] || "";
      }
      agendarSave(); render();
    } else {
      itK.qtd = t.value;
      agendarSave();
      renderDepois('[data-ki="' + t.dataset.ki + '"][data-k="qtd"]');
    }
    return;
  }
  if (t.dataset && t.dataset.kit){
    var kF = kitAtual(); if (!kF) return;
    kF[t.dataset.kit] = t.value;
    agendarSave();
    if (t.dataset.kit === "nome") return;
    renderDepois('[data-kit="' + t.dataset.kit + '"]');
    return;
  }
  if (t.hasAttribute && t.hasAttribute("data-busca")){
    busca = t.value;
    renderDepois("#campo-busca");
    return;
  }
  if (t.dataset && t.dataset.sobra){                  // sobra digitada no painel
    if (escala){ escala.sobras[t.dataset.sobra] = t.value; renderDepois('[data-sobra="' + t.dataset.sobra + '"]'); }
    return;
  }
  if (t.dataset && t.dataset.esc){                    // porcentagem ou peso alvo
    if (escala){ escala[t.dataset.esc] = t.value; renderDepois('[data-esc="' + t.dataset.esc + '"]'); }
    return;
  }
  if (t.dataset && t.dataset.est){                    // saldo ajustado à mão
    var ie = insumo(t.dataset.est);
    if (ie){
      ie.estoque = num(t.value);
      agendarSave();
      renderDepois('[data-est="' + t.dataset.est + '"]');
    }
    return;
  }
  if (!r) return;

  if (t.dataset.r){                                   // campos da receita
    r[t.dataset.r] = t.value;
    agendarSave(); atualizarFormatos();
    return;
  }
  if (t.dataset.f != null && t.dataset.f !== ""){      // campos do formato
    var f = r.formatos[parseInt(t.dataset.f, 10)]; if (!f) return;
    f[t.dataset.k] = t.value;
    agendarSave();
    if (t.dataset.k === "nome"){
      var eyebrow = t.closest(".fmt").querySelector(".fmt-emb .eyebrow");
      if (eyebrow) eyebrow.textContent = "Embalagem de cada " + (t.value || "sabonete").toLowerCase();
    }
    atualizarFormatos();
    return;
  }
  if (t.dataset.p != null && t.dataset.p !== ""){       // preço de um formato
    var fp = r.formatos[parseInt(t.dataset.p, 10)]; if (!fp) return;
    fp.precoPraticado = t.value;
    agendarSave(); atualizarFormatos();
    return;
  }
  if (t.dataset.item){                                 // ingrediente da massa
    var it = (r.itens || [])[parseInt(t.dataset.idx, 10)]; if (!it) return;
    it[t.dataset.k] = t.value;
    if (t.dataset.k === "insumoId"){ var ni = insumo(t.value); it.lote = ni ? (ni.lote || "") : ""; }
    agendarSave();
    if (t.dataset.k === "insumoId") render(); else atualizarIngredientes();
    return;
  }
  if (t.dataset.emb != null && t.dataset.emb !== ""){   // embalagem de um formato
    var f2 = r.formatos[parseInt(t.dataset.emb, 10)]; if (!f2) return;
    var e2 = (f2.embalagem || [])[parseInt(t.dataset.idx, 10)]; if (!e2) return;
    e2[t.dataset.k] = t.value;
    if (t.dataset.k === "insumoId"){ var ne = insumo(t.value); e2.lote = ne ? (ne.lote || "") : ""; }
    agendarSave();
    if (t.dataset.k === "insumoId") render(); else atualizarFormatos();
  }
});

/* ============ tema e marca ============ */
var CHAVE_TEMA = "saboaria.tema";
function aplicaTema(t){
  var raiz = document.documentElement;
  if (t === "dark" || t === "light") raiz.setAttribute("data-theme", t);
  else raiz.removeAttribute("data-theme");
  try { localStorage.setItem(CHAVE_TEMA, t); } catch(e){}
}
function escuroAgora(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function alternaTema(){
  aplicaTema(escuroAgora() ? "light" : "dark");
  toast(escuroAgora() ? "Modo noturno" : "Modo claro");
}
function iniciaTema(){
  var t = null;
  try { t = localStorage.getItem(CHAVE_TEMA); } catch(e){}
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
}
function repeteMarca(){
  var svg = document.getElementById("marca");
  if (!svg) return;
  var pai = svg.parentNode, prox = svg.nextSibling;
  pai.removeChild(svg); void svg.offsetWidth; pai.insertBefore(svg, prox);
}

/* ============ arranque ============ */
function iniciar(){
  iniciaTema();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  var p = (window.claude && window.claude.use)
    ? window.claude.use("artifact")["catch"](function(){ return null; })
    : Promise.resolve(null);
  p.then(function(a){ canPublish = !!a; return retomarArquivo(); })
   ["catch"](function(){})
   .then(function(){ return carregar(); })
   ["catch"](function(){ return carregar(); })
   .then(function(){ render(); })
   ["catch"](function(){ render(); });
}
iniciar();
})();
</script>
